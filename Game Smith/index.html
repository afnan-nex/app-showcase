<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GameSmith — Professional 2D Game Creator & Runtime Engine</title>
  <meta name="description" content="Professional browser-based 2D game development workstation featuring visual event rules, scene hierarchy editor, pixel art sprite studio, 2D physics engine, and instant 60 FPS play mode." />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Top Editor Toolbar -->
    <header class="editor-topbar" role="toolbar" aria-label="GameSmith Main Toolbar">
      <!-- Brand & Project Template -->
      <div class="toolbar-group">
        <div class="brand-section" title="GameSmith 2D Game Workstation">
          <span class="brand-logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          </span>
          <span class="brand-title">GameSmith</span>
        </div>

        <div class="toolbar-divider"></div>

        <select id="select-template" class="form-control form-control-sm w-48" title="Load Game Template">
          <option value="platformer">Template: CyberRunner (Platformer)</option>
          <option value="shooter">Template: Void Striker (Shooter)</option>
          <option value="adventure">Template: Shadow Crypt (Adventure)</option>
        </select>
      </div>

      <!-- Play Mode Controls (Prominent Center) -->
      <div class="toolbar-group play-controls-group">
        <button class="btn btn-sm btn-primary" id="btn-play-game" title="Run Game Mode (Ctrl+P)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Play Mode</span>
        </button>
        <button class="btn btn-sm btn-ghost" id="btn-pause-game" title="Pause / Resume Game">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button class="btn btn-sm btn-ghost" id="btn-stop-game" title="Stop & Restore Editor (ESC)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
        </button>

        <span class="badge badge-secondary font-mono text-xs" id="editor-mode-badge">EDITOR MODE</span>
      </div>

      <!-- Scene, Grid, Zoom & Project Actions -->
      <div class="toolbar-group">
        <!-- Scene Selector -->
        <select id="select-active-scene" class="form-control form-control-sm w-40" title="Switch Active Scene"></select>
        <button class="btn btn-sm btn-secondary" id="btn-new-scene" title="Create New Scene">
          + Scene
        </button>

        <div class="toolbar-divider"></div>

        <!-- Grid & Colliders -->
        <button class="btn btn-sm btn-secondary active" id="btn-toggle-grid" title="Toggle Grid Snapping (G)">Grid</button>
        <select id="select-grid-size" class="form-control form-control-sm w-16" title="Grid Snapping Size">
          <option value="16">16px</option>
          <option value="32" selected>32px</option>
          <option value="64">64px</option>
        </select>
        <button class="btn btn-sm btn-secondary active" id="btn-toggle-colliders" title="Toggle Collider Wireframes (C)">Colliders</button>

        <div class="toolbar-divider"></div>

        <!-- Zoom -->
        <button class="btn btn-sm btn-secondary" id="btn-zoom-out" title="Zoom Out">&minus;</button>
        <button class="btn btn-sm btn-secondary" id="btn-zoom-reset" title="Reset Zoom (100%)">100%</button>
        <button class="btn btn-sm btn-secondary" id="btn-zoom-in" title="Zoom In">&plus;</button>

        <div class="toolbar-divider"></div>

        <!-- Settings & Shortcuts -->
        <button class="btn btn-sm btn-secondary" id="btn-project-settings" title="Project Settings">Settings</button>
        <button class="btn btn-sm btn-secondary" id="btn-help-shortcuts" title="Keyboard Shortcuts & Help">?</button>

        <div class="toolbar-divider"></div>

        <!-- Export / Import -->
        <button class="btn btn-sm btn-secondary" id="btn-export-html" title="Export Standalone Playable HTML Game File">Export HTML</button>
        <button class="btn btn-sm btn-secondary" id="btn-export-project" title="Export Game Project as JSON">Export JSON</button>
        <button class="btn btn-sm btn-secondary" id="btn-import-project" title="Import Game Project JSON">Import</button>
        <input type="file" id="file-import-project" accept=".json" style="display: none;" />
      </div>
    </header>

    <!-- Mobile View Switcher (Visible on small screens) -->
    <nav class="mobile-nav-switcher" aria-label="Mobile Panel Switcher">
      <button class="mobile-nav-btn" data-view="hierarchy">Hierarchy</button>
      <button class="mobile-nav-btn active" data-view="canvas">Canvas</button>
      <button class="mobile-nav-btn" data-view="events">Event Sheet</button>
      <button class="mobile-nav-btn" data-view="inspector">Inspector</button>
    </nav>

    <!-- Main Workspace (Left Panels, Central Canvas, Right Inspector) -->
    <main class="editor-main-body">
      
      <!-- Left Panel: Scene Hierarchy Tree & Assets -->
      <aside class="editor-panel-left" id="scene-tree-container" aria-label="Hierarchy & Assets"></aside>

      <!-- Center: Canvas Viewport & Bottom Event Sheet -->
      <section class="editor-center-workspace" aria-label="Canvas and Visual Events">
        
        <!-- Canvas Viewport -->
        <div class="canvas-viewport-container" id="canvas-viewport-container">
          <canvas id="game-canvas"></canvas>

          <!-- On-Screen Virtual Touch Gamepad (Active during mobile play mode) -->
          <div class="mobile-touch-gamepad" id="mobile-touch-gamepad">
            <div class="touch-dpad-container">
              <div class="touch-dpad-row">
                <button class="touch-btn touch-dpad-btn" id="touch-btn-up" aria-label="Up">&uarr;</button>
              </div>
              <div class="touch-dpad-row touch-dpad-middle">
                <button class="touch-btn touch-dpad-btn" id="touch-btn-left" aria-label="Left">&larr;</button>
                <div class="touch-dpad-center"></div>
                <button class="touch-btn touch-dpad-btn" id="touch-btn-right" aria-label="Right">&rarr;</button>
              </div>
              <div class="touch-dpad-row">
                <button class="touch-btn touch-dpad-btn" id="touch-btn-down" aria-label="Down">&darr;</button>
              </div>
            </div>

            <div class="touch-action-buttons">
              <button class="touch-btn touch-action-btn action-b" id="touch-btn-b" aria-label="Shoot / Action">B</button>
              <button class="touch-btn touch-action-btn action-a" id="touch-btn-a" aria-label="Jump">A</button>
            </div>
          </div>
        </div>

        <!-- Bottom Panel: Visual Event Sheet -->
        <div class="editor-panel-bottom" id="bottom-sheet-container" aria-label="Visual Rules Event Sheet"></div>
      </section>

      <!-- Right Panel: Object & Scene Inspector -->
      <aside class="editor-panel-right" id="inspector-panel-container" aria-label="Property Inspector"></aside>

    </main>

    <!-- Status Bar -->
    <footer class="editor-status-bar">
      <div id="project-stats-info">Objects: 0 &bull; Rules: 0 &bull; Scenes: 1</div>
      <div class="flex items-center gap-3">
        <span>Controls: WASD / Arrows / Space &bull; Play: Ctrl+P &bull; Stop: ESC</span>
        <span>GameSmith v1.0 &bull; 60 FPS Engine</span>
      </div>
    </footer>

    <!-- Modals (Sprite Painter, Project Settings, Shortcuts) -->
    <div class="modal-container-wrapper" id="gamesmith-modal-container"></div>

  </div>

  <!-- Standalone Application Script Bundle (Works on both http:// and direct file:/// double-click) -->
  <script src="bundle.js"></script>
</body>
</html>
