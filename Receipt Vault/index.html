<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ReceiptVault — Document & Warranty Management Digital Filing Cabinet</title>
  <meta name="description" content="Offline-first digital filing cabinet, receipt keeper, warranty countdown tracker, and financial analytics dashboard." />
  <meta name="theme-color" content="#080c14" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-container" id="app-root">
    
    <!-- Top Menu & Action Bar -->
    <header class="editor-topbar" role="banner">
      <!-- Brand Section -->
      <div class="toolbar-group">
        <div class="brand-section" aria-label="ReceiptVault Application">
          <span class="brand-logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><path d="M8 7h8"></path><path d="M8 11h8"></path><path d="M8 15h5"></path></svg>
          </span>
          <span>ReceiptVault</span>
        </div>

        <div class="toolbar-divider" aria-hidden="true"></div>

        <button class="btn btn-sm btn-primary" id="btn-new-receipt" title="Add New Receipt / Document" aria-label="Add New Receipt">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New Receipt</span>
        </button>

        <button class="btn btn-sm btn-secondary" id="btn-reset-demo-vault" title="Reset Demo Sample Receipts" aria-label="Reset Demo Vault">Reset Vault</button>
      </div>

      <!-- Backup & Restore Actions -->
      <div class="toolbar-group">
        <button class="btn btn-sm btn-secondary" id="btn-export-vault-json" title="Export Full JSON Backup" aria-label="Backup JSON">Backup JSON</button>
        <button class="btn btn-sm btn-secondary" id="btn-import-vault-json" title="Restore Full JSON Backup" aria-label="Restore Backup">Restore</button>
        <input type="file" id="file-import-vault" accept=".json" style="display: none;" aria-label="Import Backup File" />
      </div>
    </header>

    <!-- Main Workspace (Left Nav Sidebar + Central Workspace + Right Inspector) -->
    <div class="editor-main-body">
      
      <!-- Left Navigation Sidebar -->
      <aside class="editor-sidebar-left" role="navigation" aria-label="Sidebar Navigation">
        <button class="nav-tab-btn active" data-tab="dashboard" role="tab" aria-selected="true" aria-controls="main-workspace-view">
          <div class="tab-left-content">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span class="tab-title">Dashboard</span>
          </div>
        </button>

        <button class="nav-tab-btn" data-tab="library" role="tab" aria-selected="false" aria-controls="main-workspace-view">
          <div class="tab-left-content">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><path d="M8 7h8"></path><path d="M8 11h8"></path><path d="M8 15h5"></path></svg>
            <span class="tab-title">All Documents</span>
          </div>
          <span class="badge badge-secondary tab-badge-pill" id="badge-total-docs">0</span>
        </button>

        <button class="nav-tab-btn" data-tab="warranties" role="tab" aria-selected="false" aria-controls="main-workspace-view">
          <div class="tab-left-content">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
            <span class="tab-title">Warranties & Returns</span>
          </div>
          <span class="badge badge-warning tab-badge-pill" id="badge-expiring-warranties" style="display: none;">0</span>
        </button>

        <button class="nav-tab-btn" data-tab="reports" role="tab" aria-selected="false" aria-controls="main-workspace-view">
          <div class="tab-left-content">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span class="tab-title">Financial Reports</span>
          </div>
        </button>
      </aside>

      <!-- Central Workspace Viewport (Dashboard / Library / Reports) -->
      <main class="editor-center-workspace" id="main-workspace-view" role="main"></main>

      <!-- Resizable Vertical Splitter -->
      <div id="library-viewer-splitter" title="Drag to Resize Inspector" aria-hidden="true"></div>

      <!-- Right Document Inspector Panel (Active on Library & Warranties) -->
      <aside class="editor-inspector-right" id="document-viewer-container" aria-label="Document Inspector Panel"></aside>

    </div>

    <!-- Status Bar -->
    <footer class="editor-statusbar" role="contentinfo">
      <div>Privacy: <strong>100% Private Local Storage</strong> &bull; Zero Server Upload &bull; Works Offline</div>
      <div class="flex items-center gap-3">
        <span>ReceiptVault v1.0 &bull; Warranty & Financial Filing Engine</span>
      </div>
    </footer>

  </div>

  <!-- Upload & Extraction Modal Container -->
  <div class="modal-container" id="upload-modal-container"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Standalone Application Script Bundle (Works on HTTP, HTTPS & direct file:/// double-click) -->
  <script src="bundle.js"></script>
</body>
</html>
