<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBench — Developer Utility Workstation</title>
  <meta name="description" content="Professional browser-based developer utility workstation featuring 20 serious developer utilities, multi-tab workspace, command palette, and dark/light themes." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 17 10 11 4 5'/><line x1='12' y1='19' x2='20' y2='19'/></svg>" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-header">
        <a href="#" class="brand-title" title="DevBench Workstation">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          </span>
          <span>DevBench</span>
        </a>
      </div>

      <!-- Quick Search Filter in Sidebar -->
      <div class="sidebar-search-box">
        <input type="text" id="sidebar-search-input" class="form-control form-control-sm" placeholder="Filter utilities..." aria-label="Filter utilities list" />
      </div>

      <!-- Scrollable Tools Navigation -->
      <div class="sidebar-scroll-area">
        <!-- Pinned Favorites -->
        <div class="sidebar-section mb-3">
          <div class="sidebar-section-title">Pinned Favorites</div>
          <div id="sidebar-favorites-list"></div>
        </div>

        <!-- Recent Tools -->
        <div class="sidebar-section mb-3">
          <div class="sidebar-section-title">Recent Utilities</div>
          <div id="sidebar-recents-list"></div>
        </div>

        <!-- Categorized Tools List (20 Utilities) -->
        <div class="sidebar-section">
          <div id="sidebar-tools-list"></div>
        </div>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <span class="text-xs text-muted font-mono">DevBench v1.0 &bull; Offline</span>
        <button class="btn-icon" id="btn-theme-toggle" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </aside>

    <!-- Main Application Shell -->
    <main class="app-main" id="main-content">
      
      <!-- Top Utility Header -->
      <header class="app-topbar">
        <button class="mobile-nav-toggle" id="btn-mobile-sidebar-toggle" aria-label="Toggle navigation menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Global Command Palette Search Trigger -->
        <button class="topbar-search-btn" id="topbar-search-trigger" aria-label="Open command palette">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Search utilities or actions...</span>
          <span class="kbd-shortcut">Ctrl+K</span>
        </button>

        <div class="flex items-center gap-3">
          <span class="badge badge-secondary font-mono text-xs hidden-mobile">Multi-Tab Workstation</span>
        </div>
      </header>

      <!-- Multi-Tool Tab Bar -->
      <nav class="editor-tab-bar" id="editor-tab-bar" aria-label="Open utility tabs">
        <!-- Injected dynamically by app router -->
      </nav>

      <!-- Active Tool Workspace -->
      <section class="active-tool-workspace" id="active-tool-workspace" aria-label="Tool workspace">
        <!-- Rendered dynamically by active tool view -->
      </section>
    </main>

    <!-- Command Palette Modal Dialog -->
    <div class="command-palette-overlay" id="command-palette-dialog" role="dialog" aria-modal="true" aria-label="Command Palette">
      <div class="command-palette-modal">
        <div class="palette-input-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="palette-search-input" placeholder="Type a utility name, command, or keyword..." autocomplete="off" aria-label="Command search input" />
          <span class="kbd-shortcut">ESC</span>
        </div>
        <div class="palette-results-list" id="palette-results-list" role="listbox"></div>
      </div>
    </div>

    <!-- Side Drawer Panel (History / Inspector) -->
    <aside class="side-drawer-panel" id="side-drawer" aria-label="Input History Drawer"></aside>

    <!-- General Modals Container -->
    <div class="modal-container-wrapper" id="devbench-modal-container" role="dialog" aria-modal="true"></div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="devbench-toast-container" aria-live="polite"></div>

  </div>

  <!-- Standalone Application Script Bundle (Works on both http:// and direct file:/// double-click) -->
  <script src="bundle.js"></script>
</body>
</html>
