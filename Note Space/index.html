<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="sans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteSpace — Knowledge & Workspace</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
</head>
<body>
  <div id="app-root">
    <!-- Left Workspace Sidebar -->
    <aside id="app-sidebar" aria-label="Workspace Sidebar"></aside>

    <!-- Main Application Canvas -->
    <main id="main-canvas">
      <!-- Top Navigation & Breadcrumbs Bar -->
      <header id="app-topbar">
        <div class="topbar-left">
          <button class="topbar-icon-btn" id="topbar-sidebar-toggle" title="Toggle Sidebar (Ctrl+\)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          </button>
          <nav id="topbar-breadcrumbs" aria-label="Breadcrumb"></nav>
        </div>

        <div class="topbar-right">
          <div id="topbar-save-status" class="topbar-save-badge is-saved">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Saved</span>
          </div>

          <button class="topbar-icon-btn topbar-fav-btn" id="topbar-fav-btn" title="Toggle Favorite">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </button>

          <button class="topbar-icon-btn" id="topbar-lock-btn" title="Lock Page (Read-only)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </button>

          <button class="topbar-icon-btn" id="topbar-width-btn" title="Toggle Full Width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7m0-18H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7m0-18v18"></path></svg>
          </button>

          <button class="topbar-icon-btn" id="topbar-history-btn" title="Page History & Revisions">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline><polyline points="12 7 12 12 15 15"></polyline></svg>
          </button>

          <button class="topbar-icon-btn" id="topbar-more-btn" title="Page Options">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
          </button>

          <button class="btn-sm btn-primary" id="topbar-new-page-btn" title="Create New Page" style="margin-left:4px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New</span>
          </button>
        </div>
      </header>

      <!-- Scrollable Editor Container -->
      <div class="editor-scroll-view">
        <!-- Main Document / Database View -->
        <article id="main-editor-container">
          <!-- Page Cover Area -->
          <div id="page-cover-wrap" style="display:none;"></div>

          <!-- Page Header (Icon + Title) -->
          <header id="page-header-wrap">
            <div class="page-icon-row">
              <button id="page-icon-btn" title="Change icon">📄</button>
              <div class="header-hover-actions">
                <button class="header-hover-action-btn" id="header-add-icon-btn">+ Add Icon</button>
                <button class="header-hover-action-btn" id="header-add-cover-btn">+ Add Cover</button>
              </div>
            </div>
            <input type="text" id="page-title-input" placeholder="Untitled" spellcheck="false" autocomplete="off" />
          </header>

          <!-- Block Editor Engine Mount -->
          <section id="editor-body"></section>

          <!-- Database Engine Mount -->
          <section id="database-body" style="display:none;"></section>
        </article>

        <!-- Trash View Container -->
        <section id="trash-view-container" style="display:none;">
          <div class="trash-header-row">
            <h2>Trash Bin</h2>
            <button class="btn-sm btn-danger" id="empty-trash-btn">Empty Trash</button>
          </div>
          <div class="trash-list" id="trash-items-list"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- NoteSpace Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/database.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/command-palette.js"></script>
  <script src="js/history.js"></script>
  <script src="js/export-import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
