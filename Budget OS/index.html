<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetOS — Personal Finance & Cash-Flow Simulation Engine</title>
  <meta name="description" content="A complete browser-based personal finance management and simulation application with client-side IndexedDB persistence, what-if scenarios, and cash-flow forecasting." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/views.css" />
  <link rel="stylesheet" href="styles/print.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
          </svg>
        </div>
        <div>
          <div class="brand-title">BudgetOS</div>
        </div>
        <span class="brand-badge">Local</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-category-title">Core Planning</div>
        
        <a href="#dashboard" class="nav-link active" data-view="dashboard" id="nav-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
          <span>Dashboard</span>
        </a>

        <a href="#transactions" class="nav-link" data-view="transactions" id="nav-transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          <span>Transactions</span>
        </a>

        <a href="#accounts" class="nav-link" data-view="accounts" id="nav-accounts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          <span>Accounts</span>
        </a>

        <a href="#budgets" class="nav-link" data-view="budgets" id="nav-budgets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
          <span>Budgets</span>
        </a>

        <a href="#goals" class="nav-link" data-view="goals" id="nav-goals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          <span>Savings Goals</span>
        </a>

        <a href="#recurring" class="nav-link" data-view="recurring" id="nav-recurring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Recurring & Bills</span>
        </a>

        <div class="nav-category-title">Simulation & Intelligence</div>

        <a href="#forecast" class="nav-link" data-view="forecast" id="nav-forecast">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
          <span>Cash-Flow Forecast</span>
        </a>

        <a href="#scenarios" class="nav-link" data-view="scenarios" id="nav-scenarios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
          <span>Scenario Builder</span>
        </a>

        <a href="#reports" class="nav-link" data-view="reports" id="nav-reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>Reports & Trends</span>
        </a>

        <div class="nav-category-title">Data & Settings</div>

        <a href="#data-hub" class="nav-link" data-view="data-hub" id="nav-data-hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>Data Hub & CSV</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="app-version-tag">BudgetOS v1.0</span>
        <button class="btn-icon" id="btn-theme-toggle" title="Toggle Light/Dark Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </aside>

    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Main Content Workspace -->
    <main class="app-main" id="main-content" role="main">
      <!-- Top Utility Bar -->
      <header class="app-topbar">
        <button class="mobile-nav-toggle" id="btn-mobile-sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="app-sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="topbar-info flex items-center gap-3">
          <span class="badge badge-secondary font-mono text-xs hidden-mobile">Shortcuts: [N] New Tx &bull; [S] Search &bull; [Ctrl+Z] Undo</span>
        </div>

        <div class="topbar-actions flex items-center gap-2">
          <button class="btn btn-sm btn-primary" id="btn-topbar-new-tx" aria-label="Create new transaction">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            + Transaction
          </button>
        </div>
      </header>

      <!-- View Container -->
      <div class="main-workspace" id="main-workspace" tabindex="-1">
        <!-- Injected dynamically by router/views -->
      </div>
    </main>

    <!-- Modal Container -->
    <div class="modal-container" id="modal-container" role="dialog" aria-modal="true"></div>

    <!-- Undo Toast Notification Container -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  </div>

  <!-- App Bootstrap (Self-contained standalone bundle) -->
  <script src="bundle.js"></script>
</body>
</html>
