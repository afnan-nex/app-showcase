<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MeetSpace — Professional browser-based meeting management workspace, agenda tool, live facilitator, collaborative notes, decisions log, and action items manager.">
  <title>MeetSpace — Meeting Management Workspace</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div id="app-container">
    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar Navigation Shell -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand-logo">
          <div class="brand-logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span>MeetSpace</span>
          <span class="brand-tag">PRO</span>
        </a>
      </div>

      <!-- Quick Action Button -->
      <div class="sidebar-action-wrap">
        <button class="btn-sidebar-new" id="sidebar-new-meeting-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Meeting</span>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <div>
          <div class="nav-group-title">Workspace</div>
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#/dashboard">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9" rx="1"/>
                    <rect x="14" y="3" width="7" height="5" rx="1"/>
                    <rect x="14" y="12" width="7" height="9" rx="1"/>
                    <rect x="3" y="16" width="7" height="5" rx="1"/>
                  </svg>
                </span>
                <span>Dashboard</span>
              </a>
            </li>

            <li class="nav-item">
              <a href="#/meetings">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                </span>
                <span>Meetings</span>
                <span class="nav-badge" id="badge-meetings-count"></span>
              </a>
            </li>

            <li class="nav-item">
              <a href="#/actions">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                  </svg>
                </span>
                <span>Action Items</span>
                <span class="nav-badge" id="badge-actions-count"></span>
              </a>
            </li>

            <li class="nav-item">
              <a href="#/decisions">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                  </svg>
                </span>
                <span>Decisions Hub</span>
              </a>
            </li>

            <li class="nav-item">
              <a href="#/analytics">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                    <line x1="2" y1="20" x2="22" y2="20"/>
                  </svg>
                </span>
                <span>Analytics</span>
              </a>
            </li>
          </ul>
        </div>

        <div>
          <div class="nav-group-title">Upcoming Schedule</div>
          <div class="sidebar-mini-meetings" id="sidebar-mini-meetings-list">
            <!-- Dynamic upcoming meetings -->
          </div>
        </div>

        <div style="margin-top: auto;">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#/settings">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                </span>
                <span>Settings</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Sidebar User Profile Card -->
      <div class="sidebar-footer">
        <a href="#/settings" class="user-profile-widget">
          <div class="user-avatar-sm" id="sidebar-user-avatar">E</div>
          <div>
            <div class="user-name-text" id="sidebar-user-name">Elena Vance</div>
            <div class="user-role-text" id="sidebar-user-role">Head of Product</div>
          </div>
        </a>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="app-main">
      <!-- Top Header Bar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-icon-only mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>

          <!-- Breadcrumbs -->
          <div class="breadcrumbs">
            <span class="breadcrumb-item hidden" id="breadcrumb-section"></span>
            <span class="breadcrumb-sep hidden" id="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current" id="breadcrumb-current">Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Command Palette Trigger Button -->
          <button class="cmd-k-trigger" onclick="Palette.open()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span class="search-hint">Search / Jump to...</span>
            <span class="kbd-badge">Ctrl K</span>
          </button>

          <!-- Shortcuts Button -->
          <button class="btn btn-ghost btn-sm btn-icon-only" onclick="Shortcuts.open()" title="Keyboard Shortcuts (?)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </button>

          <!-- Notification Bell -->
          <button class="btn btn-ghost btn-sm btn-icon-only" id="topbar-bell-btn" title="Notifications & Reminders" style="position: relative;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="badge badge-declined hidden" id="notif-badge" style="position:absolute; top:2px; right:2px; padding:1px 4px; font-size:0.6rem;"></span>
          </button>

          <!-- Theme Toggle -->
          <button class="btn btn-ghost btn-sm btn-icon-only" id="topbar-theme-toggle" title="Toggle Light / Dark Mode">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Active View Content Host -->
      <section class="app-content" id="main-content-view">
        <!-- Dynamically injected views -->
      </section>
    </main>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toast-container"></div>

  <!-- Core JavaScript Modules -->
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components/notifications.js"></script>
  <script src="js/components/shortcuts-modal.js"></script>
  <script src="js/components/command-palette.js"></script>
  <script src="js/components/export.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/meetings.js"></script>
  <script src="js/views/meeting-detail.js"></script>
  <script src="js/views/live-meeting.js"></script>
  <script src="js/views/actions.js"></script>
  <script src="js/views/decisions.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
