<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TimeGrid — Visual Time-Blocking & Daily Schedule Workstation</title>
  <meta name="description" content="Browser-based visual time-blocking, daily and weekly scheduling, conflict detection, routine templates, and focus timer workstation." />
  <meta name="theme-color" content="#080c14" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Top Menu & Action Bar -->
    <header class="editor-topbar" role="banner">
      
      <!-- Brand & Left Drawer Toggle -->
      <div class="toolbar-group">
        <button class="btn btn-xs btn-secondary" id="btn-toggle-left-drawer" title="Toggle Task Backlog (Drawer)" aria-label="Toggle Task Backlog">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          <span class="hidden sm:inline">Tasks</span>
        </button>

        <div class="brand-section">
          <span class="brand-logo-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </span>
          <span>TimeGrid</span>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Date Controls & Date Picker -->
        <button class="btn btn-xs btn-secondary" id="btn-prev-date" title="Previous Day/Week" aria-label="Previous Day or Week">&larr;</button>
        <button class="btn btn-xs btn-secondary" id="btn-today-date" title="Jump to Today (T)" aria-label="Jump to Today">Today</button>
        <button class="btn btn-xs btn-secondary" id="btn-next-date" title="Next Day/Week" aria-label="Next Day or Week">&rarr;</button>

        <div class="relative flex items-center">
          <span class="font-bold text-xs text-primary px-1.5 font-mono cursor-pointer" id="lbl-current-date-display" title="Click to pick calendar date">Today</span>
          <input type="date" id="inp-date-picker" class="opacity-0 absolute inset-0 cursor-pointer w-full" title="Pick Date" aria-label="Select calendar date" />
        </div>
      </div>

      <!-- View Modes & Snapping Controls -->
      <div class="toolbar-group">
        <div class="view-mode-toggle-group flex bg-elevated p-0.5 rounded border border-subtle" role="group" aria-label="Calendar view selector">
          <button class="btn btn-xs btn-view-mode active" data-view="day" aria-label="Day View">Day</button>
          <button class="btn btn-xs btn-view-mode" data-view="workweek" aria-label="Workweek View">5-Day</button>
          <button class="btn btn-xs btn-view-mode" data-view="week" aria-label="Full Week View">Week</button>
        </div>

        <div class="toolbar-divider"></div>

        <span class="text-xs text-muted hidden md:inline">Snap:</span>
        <select id="select-grid-snap" class="form-control form-control-sm w-16 font-mono" title="Grid Snapping Interval" aria-label="Grid Snapping Interval">
          <option value="5">5m</option>
          <option value="10">10m</option>
          <option value="15" selected>15m</option>
          <option value="30">30m</option>
        </select>

        <button class="btn btn-xs btn-secondary font-mono" id="btn-toggle-24h" title="Toggle 12-hour / 24-hour time format" aria-label="Toggle 12h or 24h format">12h</button>
      </div>

      <!-- Action Buttons & Badges -->
      <div class="toolbar-group">
        <!-- Live Conflict Indicator Pill -->
        <span id="topbar-conflict-badge" class="badge badge-secondary text-emerald font-mono font-bold" title="Conflict status">
          0 Conflicts
        </span>

        <button class="btn btn-sm btn-primary" id="btn-quick-new-block" title="Add Focus Block (N)" aria-label="Create new block">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="hidden sm:inline">New Block</span>
        </button>

        <button class="btn btn-sm btn-secondary" id="btn-open-scenarios" title="Simulate & Benchmark Schedule Scenarios" aria-label="Compare schedule scenarios">Simulate</button>
        
        <button class="btn btn-sm btn-secondary hidden lg:inline-flex" id="btn-reset-schedule" title="Reset to Demonstration Schedule">Reset</button>

        <div class="toolbar-divider"></div>

        <button class="btn btn-sm btn-secondary hidden sm:inline-flex" id="btn-export-ics" title="Export iCalendar (.ICS) file">ICS</button>
        <button class="btn btn-sm btn-secondary hidden sm:inline-flex" id="btn-export-json" title="Export Backup JSON">Backup</button>
        <button class="btn btn-sm btn-secondary hidden sm:inline-flex" id="btn-import-json" title="Restore Backup JSON">Restore</button>
        <input type="file" id="file-import-timegrid" accept=".json" style="display: none;" aria-label="Upload backup JSON file" />

        <button class="btn btn-icon-xs text-muted" id="btn-open-shortcuts" title="Keyboard Shortcuts & Guide (?)" aria-label="Keyboard Shortcuts">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </button>

        <!-- Right Inspector Toggle (Mobile) -->
        <button class="btn btn-xs btn-secondary" id="btn-toggle-right-inspector" title="Toggle Property Inspector" aria-label="Toggle Property Inspector">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
          <span class="hidden sm:inline">Inspect</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Body (Left Drawer + Central Time Grid + Right Inspector) -->
    <div class="editor-main-body">
      
      <!-- Left Task Backlog & Routine Templates Drawer -->
      <aside class="editor-drawer-left" id="task-drawer-container" role="region" aria-label="Task backlog and routine templates"></aside>

      <!-- Center Time Grid Canvas Viewport -->
      <main class="editor-center-workspace" id="time-grid-canvas-container" role="main" aria-label="Visual time-blocking schedule canvas"></main>

      <!-- Right Block Property Inspector & Analytics -->
      <aside class="editor-inspector-right" id="block-inspector-container" role="region" aria-label="Block properties and analytics"></aside>

      <!-- Mobile Drawer Backdrop Overlay -->
      <div class="drawer-backdrop-mobile" id="drawer-backdrop-mobile"></div>

    </div>

    <!-- Status Bar -->
    <footer class="editor-statusbar" role="contentinfo">
      <div id="status-bar-readout">TimeGrid v1.0 &bull; Real-time Visual Time-Blocking Engine</div>
      <div class="flex items-center gap-3">
        <span>Double-click grid to schedule &bull; Drag handles to resize &bull; <strong>F</strong> for Focus &bull; <strong>?</strong> for Shortcuts</span>
      </div>
    </footer>

  </div>

  <!-- Focus Mode Fullscreen Overlay -->
  <div class="focus-overlay-container" id="focus-mode-overlay-container" role="dialog" aria-modal="true" aria-label="Focus mode timer"></div>

  <!-- Scenario Simulation & Comparison Modal -->
  <div class="modal-container" id="scenario-modal-container" role="dialog" aria-modal="true" aria-label="Scenario comparison modal"></div>

  <!-- Keyboard Shortcuts Modal -->
  <div class="modal-container" id="shortcuts-modal-container" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts cheat sheet"></div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="global-toast-container" role="status" aria-live="polite"></div>

  <!-- Standalone Application Script Bundle (Works on both http:// and direct file:/// double-click) -->
  <script src="bundle.js"></script>
</body>
</html>
