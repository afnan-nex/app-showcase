<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelForge — Pixel Art Creation & Animation Workstation</title>
  <meta name="description" content="Professional browser-based pixel art creator, sprite animator, and tilemap editor with multi-layer editing, dithering, and sprite sheet export." />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Top Menu & Properties Bar -->
    <header class="editor-topbar">
      <!-- Brand & Project Template -->
      <div class="toolbar-group">
        <div class="brand-section">
          <span class="brand-logo-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          <span>PixelForge</span>
        </div>

        <div class="toolbar-divider"></div>

        <button class="btn btn-sm btn-secondary" id="btn-new-project" title="New Canvas">+ New</button>

        <select id="select-project-template" class="form-control form-control-sm w-44" title="Load Demo Project">
          <option value="knight">Project: Cyber Knight (Animation)</option>
          <option value="dungeon">Project: Dungeon Tileset (Tilemap)</option>
          <option value="city">Project: Cyberpunk Skyline (Art)</option>
        </select>
      </div>

      <!-- Tool Properties (Brush Size, Pixel Perfect, Symmetry) -->
      <div class="toolbar-group">
        <span class="text-xs text-muted">Brush:</span>
        <select id="select-brush-size" class="form-control form-control-sm w-16" title="Brush Size">
          <option value="1" selected>1 px</option>
          <option value="2">2 px</option>
          <option value="3">3 px</option>
          <option value="4">4 px</option>
        </select>

        <button class="btn btn-sm btn-secondary active" id="btn-toggle-pixel-perfect" title="Pixel-Perfect Stroke (Removes Double Corners)">Pixel-Perfect</button>

        <span class="text-xs text-muted ml-1">Mirror:</span>
        <select id="select-symmetry-mode" class="form-control form-control-sm w-28" title="Symmetry Mirror Line">
          <option value="none" selected>No Mirror</option>
          <option value="vertical">Vertical Line</option>
          <option value="horizontal">Horizontal Line</option>
          <option value="both">Quad Mirror</option>
        </select>
      </div>

      <!-- Undo, Zoom & Export Actions -->
      <div class="toolbar-group">
        <button class="btn btn-sm btn-secondary" id="btn-undo" title="Undo (Ctrl+Z)" disabled>&larr; Undo</button>
        <button class="btn btn-sm btn-secondary" id="btn-redo" title="Redo (Ctrl+Y)" disabled>Redo &rarr;</button>

        <div class="toolbar-divider"></div>

        <button class="btn btn-sm btn-secondary" id="btn-zoom-out" title="Zoom Out">&minus;</button>
        <span class="badge badge-secondary font-mono text-xs" id="zoom-percentage-label">1600%</span>
        <button class="btn btn-sm btn-secondary" id="btn-zoom-in" title="Zoom In">&plus;</button>
        <button class="btn btn-sm btn-secondary" id="btn-fit-canvas" title="Center Canvas">Center</button>
        <button class="btn btn-sm btn-secondary active" id="btn-toggle-grid" title="Toggle Pixel Grid">Grid</button>

        <div class="toolbar-divider"></div>

        <!-- Export -->
        <button class="btn btn-sm btn-primary" id="btn-export-png" title="Export Upscaled PNG">Export PNG</button>
        <button class="btn btn-sm btn-secondary" id="btn-export-sheet" title="Export Sprite Sheet">Sprite Sheet</button>
        <button class="btn btn-sm btn-secondary" id="btn-export-svg" title="Export Infinite Animated SVG">SVG Anim</button>
        <button class="btn btn-sm btn-secondary" id="btn-export-video" title="Export Video Recording (WebM/MP4)">Video</button>
        <button class="btn btn-sm btn-secondary" id="btn-export-json" title="Export Project JSON">Save JSON</button>
        <button class="btn btn-sm btn-secondary" id="btn-import-json" title="Import Project JSON">Import</button>
        <input type="file" id="file-import-project" accept=".json" style="display: none;" />
      </div>
    </header>

    <!-- Main Workspace (Left Tool Palette, Central Canvas, Right Inspector) -->
    <div class="editor-main-body">
      
      <!-- Left Tool Palette -->
      <aside class="editor-tool-palette">
        <button class="btn-tool-square btn-pixel-tool active" data-tool="pencil" title="Pencil (B)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="line" title="Line Tool (L)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="rect" title="Rectangle Outline (U)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="circle" title="Circle Outline (C)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="bucket" title="Paint Bucket Fill (G)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"></path><path d="m5 2 5 5"></path><path d="M2 13h15"></path></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="picker" title="Eyedropper / Color Picker (I)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 2 4 4L6 18l-4 1 1-4L14 2Z"></path></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="dither" title="Dithering Brush (D)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" fill="currentColor"></rect><rect x="15" y="3" width="6" height="6"></rect><rect x="3" y="15" width="6" height="6"></rect><rect x="15" y="15" width="6" height="6" fill="currentColor"></rect></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="select" title="Marquee Selection (S)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"><rect x="3" y="3" width="18" height="18" rx="1"></rect></svg>
        </button>
        <button class="btn-tool-square btn-pixel-tool" data-tool="move" title="Pan / Move Canvas (M / Middle Click)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
        </button>
      </aside>

      <!-- Center: Pixel Canvas Viewport & Bottom Animation Timeline -->
      <div class="editor-center-workspace">
        
        <!-- Canvas Viewport -->
        <div class="canvas-workspace-container" id="canvas-workspace-container">
          <canvas id="pixel-canvas"></canvas>
        </div>

        <!-- Bottom Animation Timeline Filmstrip -->
        <div class="editor-panel-timeline" id="timeline-container"></div>
      </div>

      <!-- Right Inspector: Color Picker & Layer Stack -->
      <aside class="editor-inspector-right">
        <!-- Top Half: Color Picker -->
        <div class="flex-1 flex flex-col border-b overflow-hidden" id="color-picker-container"></div>

        <!-- Bottom Half: Layers Stack -->
        <div class="flex-1 flex flex-col overflow-hidden" id="layer-stack-container"></div>
      </aside>

    </div>

    <!-- Status Bar -->
    <footer class="editor-statusbar">
      <div id="project-stats-readout">Size: 24x24 &bull; Frames: 6</div>
      <div id="pixel-coordinates-readout">X: 0, Y: 0</div>
      <div class="flex items-center gap-3">
        <span>Draw: Left Click &bull; Secondary: Right Click &bull; Swap: X &bull; Pan: Space+Drag</span>
        <span>PixelForge v1.0 &bull; Pixel Engine</span>
      </div>
    </footer>

  </div>

  <!-- Standalone Application Script Bundle (Works on both http:// and direct file:/// double-click) -->
  <script src="bundle.js"></script>
</body>
</html>
